<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f2ef">
  <title>Writing - wqsv.</title>
  <meta name="description" content="Technical writing, reverse engineering, and other things I've learned.">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3C/svg%3E" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/writing.css">
  <script src="/assets/js/writing.js" defer></script>
</head>

<body id="top">
  <div class="wrapper">
    <header class="site-header">
      <a class="brand" href="/">wqsv.</a>
      <nav aria-label="Main navigation">
        <a href="/">Home</a>
      </nav>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">PERSONAL ARCHIVE / WRITING</p>
        <h1 id="page-title">Writing.</h1>
        <p class="intro-description">Notes on things I've built, broken, reverse engineered, and learned along the way.
        </p>
      </section>

      <section class="archive" aria-labelledby="archive-title">
        <div class="section-heading">
          <h2 id="archive-title">All posts</h2>
          <span id="resultCount" class="mono-label" aria-live="polite"></span>
        </div>

        <div class="filters">
          <label class="search-box">
            <span class="sr-only">Search posts</span>
            <span class="search-icon" aria-hidden="true">/</span>
            <input id="searchInput" type="search" placeholder="Search titles, excerpts, tags..." autocomplete="off">
            <kbd>ESC</kbd>
          </label>

          <div class="filter-row">
            <label>
              <span class="sr-only">Filter by year</span>
              <select id="yearFilter">
                <option value="">Every year</option>
              </select>
            </label>
            <label>
              <span class="sr-only">Filter by month</span>
              <select id="monthFilter">
                <option value="">Every month</option>
              </select>
            </label>
            <label>
              <span class="sr-only">Sort posts</span>
              <select id="sortSelect">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
              </select>
            </label>
            <button id="clearFilters" class="text-button" type="button">Clear filters</button>
          </div>
        </div>

        <section class="tag-filter" aria-label="Filter by tag">
          <span class="mono-label">FILTER BY TAG</span>
          <div id="tagFilters" class="tag-filter-list"></div>
        </section>

        <div class="archive-header" aria-hidden="true">
          <span>DATE</span>
          <span>ARTICLE</span>
          <span class="archive-header-meta">DETAILS</span>
        </div>

        <section id="postsList" class="posts-list" aria-label="Writing posts" aria-live="polite">
          <p class="empty-state">Loading posts...</p>
        </section>

        <nav id="pagination" class="pagination" aria-label="Post pages"></nav>

        <footer class="archive-footer">
          <span>WQSV / WRITING ARCHIVE</span>
          <a href="#top">BACK TO TOP ↑</a>
        </footer>
      </section>
    </main>
  </div>
</body>

</html>
